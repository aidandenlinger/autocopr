name: Typecheck/Lint/Format with Pyrefly/Ruff

on:
  push:
    branches:
      - main
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions: {}

jobs:
  lint-fmt-py:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0

      - name: Format
        run: uv run --locked ruff format --diff

      - name: Lint
        run: uv run --locked ruff check --output-format github

      - name: Enforce full typing coverage
        run: uv run --locked pyrefly coverage check --output-format github

      - name: Typecheck
        run: uv run --locked pyrefly check --output-format github
